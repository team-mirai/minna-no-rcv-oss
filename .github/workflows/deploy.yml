name: Migrate DB then Deploy

# main にマージされたときに「本番 DB のマイグレーション適用 → Vercel デプロイ」を
# この順で直列に実行する（みらい議会 team-mirai/mirai-gikai の deploy.yml と同じ構成）。
#
# 以前は Vercel の Git 連携がマージと同時にビルドを始め、DB は手動適用だったため
# 「アプリだけ新しくなって DB が古い」状態が起き得た。2026-09-06、results_open_at を
# 追加した PR のマージ後にこれが起きて本番が 500 (column poll.results_open_at does not
# exist) になった。
#
# 順序を保証する仕掛け:
#   1. vercel.json の git.deploymentEnabled.main = false で、main への push では
#      Vercel が自動ビルドしないようにする（PR の Preview デプロイはそのまま）。
#   2. このワークフローが db push に成功したときだけ Vercel の Deploy Hook を叩いて
#      本番ビルドを開始する。db push が失敗すればデプロイは始まらない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同時に複数の push が来ても、本番への適用は 1 本ずつ直列に流す。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: 本番 DB へマイグレーション適用 → Vercel デプロイ開始
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # マイグレーションを当てた後で「デプロイできない」と分かると DB だけ先に進むので、
      # 2 つの secret は最初にまとめて確認する。
      - name: secret の設定を確認
        run: |
          missing=0
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL secret が未設定です。本番 Supabase の Session pooler の接続文字列 (ポート 5432) をリポジトリ secret に登録してください。GitHub Actions のランナーは IPv4 のみなので db.<ref>.supabase.co への直結は使えません。"
            missing=1
          fi
          if [ -z "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret が未設定です。vercel.json で main の自動デプロイを止めているため、この secret が無いと本番が一切デプロイされません。Vercel の Project Settings → Git → Deploy Hooks で main 向けの Hook を作り、その URL を登録してください。"
            missing=1
          fi
          [ "$missing" = "0" ]

      # Supabase CLI はリリースの tarball を直接入れる（第三者の GitHub Action は使わない）。
      # この repo の Actions ポリシーは「GitHub 製か team-mirai 製のアクションのみ」なので
      # supabase/setup-cli は起動時に弾かれる（内部で oven-sh/setup-bun も呼ぶため allowlist に
      # 1 つ足しても連鎖して失敗する。2026-09-10 の初回 run で実際に startup_failure になった）。
      # バージョンは固定し、checksums.txt で改ざんが無いことを検証してから展開する。
      - name: Supabase CLI をインストール
        env:
          SUPABASE_CLI_VERSION: 2.117.0
        run: |
          set -euo pipefail
          base="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          asset="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          sudo tar -xzf "${asset}" -C /usr/local/bin supabase
          supabase --version

      - name: 適用前の状況 (local / remote)
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      # --yes: CI (非 TTY) で確認プロンプト待ちのハングを防ぐ。未適用のマイグレーションが
      # あると db push は [Y/n] を出して stdin 待ちで止まる（みらい議会で実際に本番デプロイが
      # 数時間ハングした）。
      - name: 未適用のマイグレーションを適用
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: 適用後の状況
        if: always()
        run: supabase migration list --db-url "$SUPABASE_DB_URL" || true

      # db push が成功したときだけここに来る。Hook の POST 自体が失敗 (4xx/5xx) したら
      # ジョブを赤にする（-f）。URL は secret なのでログではマスクされる。
      - name: Vercel の本番デプロイを開始 (Deploy Hook)
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo
          echo "Vercel の本番ビルドを開始しました。進捗は Vercel のダッシュボードで確認できます。"

  smoke:
    name: 本番の疎通確認
    needs: migrate-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: デプロイ後の本番 URL が 200 を返すか確認
        run: |
          set -u
          # Deploy Hook で始めた Vercel のビルドが終わるまで少し待ってから確認する
          sleep 60
          for url in https://rcv.team-mir.ai/ https://rcv.team-mir.ai/demo; do
            ok=0
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              echo "[$i] $url -> $code"
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              sleep 20
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url が 200 を返しません。マイグレーションとアプリの整合を確認してください。"
              exit 1
            fi
          done
